# deano.art: process uploads and published edits from Artist's Entry (Rev.6)
name: Apply artist changes
on:
  push:
    branches: [main]
    paths: ["inbox/**", "edits/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-artist-changes
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pillow-heif opencv-python-headless numpy
      - name: Apply uploads and edits
        run: |
          git pull --ff-only origin main
          python tools/apply.py
      - name: Commit
        run: |
          git config user.name "deano-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Artist's Entry: apply uploads and edits"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
